[build]
  publish = "."
  functions = "netlify/functions"

# Redirect /api/contact to the serverless function
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/contact-info"
  to = "/.netlify/functions/contact-info"
  status = 200

# SPA fallback – serve index.html for unknown routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
